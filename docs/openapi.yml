openapi: 3.0.3
info:
  title: Daily trends Backend Iván
  description: |-
    Daily Trends Backend Test API DDD by Iván Fernández Campos
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local environment.
tags:
  - name: feed
    description: Everything about your Feeds
paths:
  /feed/{id}:
    put:
      tags:
        - feed
      summary: Add a new feed to the system
      description: Add a new feed to the system
      operationId: addFeed
      parameters:
        - name: id
          in: path
          description: The feed id that needs to be added
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Create a new feed in the system
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedCreatorProps'
        required: true
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
        '400':
          description: Invalid argument error
        '409':
          description: Feed already exists
        '500':
          description: A stored feed is invalid
    get:
      tags:
        - feed
      summary: Find a feed
      description: Find a feed from the shop.
      operationId: findFeed
      parameters:
        - name: id
          in: path
          description: The feed id that needs to be found
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
        '400':
          description: Invalid argument error
        '404':
          description: Feed not found
        '500':
          description: A stored feed is invalid
    delete:
      tags:
        - feed
      summary: Delete a feed
      description: Delete a feed from the system.
      operationId: deleteFeed
      parameters:
        - name: id
          in: path
          description: The feed id that needs to be deleted
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted successfully
        '400':
          description: Invalid argument error
        '404':
          description: Feed not found
        '500':
          description: A stored feed is invalid
    patch:
      tags:
        - feed
      summary: Update an existing Feed
      description: Update an existing Feed by Id
      operationId: updateFeed
      parameters:
        - name: id
          in: path
          description: The feed id that needs to be updated
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Update an existent Feed in the system
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedUpdaterProps'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
        '400':
          description: Invalid argument error
        '404':
          description: Feed not found
        '500':
          description: A stored feed is invalid
  /feed/scrap:
    get:
      tags:
        - feed
      summary: Scrap feeds
      description: >-
        Scrap feeds from external services. A headline already stored with the
        same source and title on the same UTC day is skipped. A scraped article
        without a description is stored with a null description. Only one
        scraping runs at a time: a request made while another run is in
        progress waits for it to finish and then runs.
      operationId: scrapFeed
      responses:
        '200':
          description: >-
            The feeds saved by this run, empty when every source fails or every
            headline was already stored that day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feed'
  /feed/home:
    get:
      tags:
        - feed
      summary: Get 10 home feed from external providers (ONLY EXTERNAL FEEDS)
      description: >-
        Get 10 last feeds. When the newest one is from a previous day, a
        scraping run starts in the background and the stored feeds are
        returned at once, so they may be stale until that run saves new ones.
      operationId: homeFeeds
      responses:
        '200':
          description: Successful operation
        '500':
          description: A stored feed is invalid
  /feed/list:
    get:
      tags:
        - feed
      summary: Get all feed list (IN A FUTURE, APPLY CRITERIA IMPLEMENTATION AND PAGINATION TO BE SENT FROM FRONT)
      description: Get all feeds.
      operationId: allFeeds
      responses:
        '200':
          description: Successful operation
        '500':
          description: A stored feed is invalid

components:
  schemas:
    Feed:
      required:
        - id
        - title
        - author
        - source
        - createdAt
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 407bb261-d89a-4720-9794-7113635e9a1b
        title:
          type: string
          example: theFeed
        description:
          type: string
          nullable: true
          example: theFeedDescription
        author:
          type: string
          example: theFeedAuthor
        source:
          type: string
          description: Status of the payment.
          enum:
            - CMS
            - EL_PAIS
            - EL_MUNDO
            - EL_ESPANOL
          example: CMS
        createdAt:
          type: string
          format: date
        modifiedAt:
          type: string
          format: date
    FeedCreatorProps:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          example: theFeed
        description:
          type: string
          example: theFeedDescription
        author:
          type: string
          example: theFeedAuthor
    FeedUpdaterProps:
      type: object
      properties:
        title:
          type: string
          example: theFeed
        description:
          type: string
          example: theFeedDescription
