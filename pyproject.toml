[project]
name = "daily-trends-py"
version = "0.1.0"
description = "Python port of daily-trends, a news feeds API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
daily-trends-py = "daily_trends_py.apps.cms_backend.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.41.0",
    "fastapi-cli>=0.0.32",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=9.0.0",
    "ruff>=0.16.10",
]

[tool.fastapi]
entrypoint = "daily_trends_py.apps.cms_backend.asgi:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["reference", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a running MongoDB at MONGO_URL"]
