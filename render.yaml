# Production on Render (S16). It holds no secret: MONGO_URL is set in the Render dashboard.
services:
  - type: web
    name: daily-trends-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /status
    autoDeployTrigger: checksPass
    # Only what goes into the image deploys the API: a change to web/, specs/, tests/ or docs does not.
    buildFilter:
      paths:
        - src/**
        - pyproject.toml
        - uv.lock
        - .python-version
        - Dockerfile
        - .dockerignore
    envVars:
      - key: ENV
        value: production
      - key: MONGO_URL
        sync: false
      # Generated once, when the service is created. Regenerating it logs every administrator out.
      - key: AUTH_SECRET_KEY
        generateValue: true
      # Render's proxy terminates HTTPS: trusting its X-Forwarded-Proto keeps the URLs the API
      # builds on https://.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  - type: web
    name: daily-trends-web
    runtime: static
    rootDir: web
    # Node comes from web/.nvmrc, and pnpm from packageManager through Corepack. `corepack enable`
    # would write its shims to /usr/bin, which is read-only on Render.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
    envVars:
      # Read by Vite at build time: changing it needs a new build. It is public, not a secret.
      - key: VITE_API_BASE_URL
        value: https://daily-trends-api.onrender.com
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
    headers:
      # File names under assets/ carry a content hash, so they never change.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    # Render rewrites only paths with no file, so a reload on any route of the app opens it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
