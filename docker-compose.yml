services:
  api:
    build: .
    environment:
      PORT: ${PORT:-5000}
      MONGO_URL: mongodb://mongo:27017/daily-trends
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb:
